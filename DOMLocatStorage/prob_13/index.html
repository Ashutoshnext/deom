<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Todo List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        #taskInput {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 10px;
        }

        #searchInput {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 10px 0;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        li.completed {
            text-decoration: line-through;
            color: gray;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Enhanced Todo List</h1>
        <input type="text" id="taskInput" placeholder="Add a new task..." />
        <button id="addTaskBtn">Add Task</button>
        <input type="text" id="searchInput" placeholder="Search tasks..." />
        <ul id="taskList"></ul>
    </div>

    <script>

        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        const taskInput = document.getElementById('taskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const searchInput = document.getElementById('searchInput');
        const taskList = document.getElementById('taskList');
        const generateID = () => '_' + Math.random().toString(36).substr(2, 9);
        const renderTasks = (filter = '') => {
            taskList.innerHTML = '';
            const filteredTasks = tasks.filter(task =>
                task.text.toLowerCase().includes(filter.toLowerCase())
            );

            filteredTasks.forEach(task => {
                const li = document.createElement('li');
                li.classList.toggle('completed', task.completed);
                li.dataset.id = task.id;

                li.innerHTML = `
                    <span>${task.text}</span>
                    <div class="buttons">
                        <button class="completeBtn">${task.completed ? 'Undo' : 'Complete'}</button>
                        <button class="deleteBtn">Delete</button>
                    </div>
                `;
                li.querySelector('.completeBtn').addEventListener('click', () => toggleTaskCompletion(task.id));
                li.querySelector('.deleteBtn').addEventListener('click', () => deleteTask(task.id));

                taskList.appendChild(li);
            });
        };
        const addTask = () => {
            const taskText = taskInput.value.trim();
            if (!taskText) return alert('Task cannot be empty!');

            const newTask = {
                id: generateID(),
                text: taskText,
                completed: false
            };

            tasks.push(newTask);
            updateLocalStorage();
            taskInput.value = '';
            renderTasks();
        };
        const toggleTaskCompletion = (id) => {
            const task = tasks.find(task => task.id === id);
            if (task) {
                task.completed = !task.completed;
                updateLocalStorage();
                renderTasks(searchInput.value);
            }
        };
        const deleteTask = (id) => {
            tasks = tasks.filter(task => task.id !== id);
            updateLocalStorage();
            renderTasks(searchInput.value);
        };
        const updateLocalStorage = () => {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        };
        addTaskBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });
        searchInput.addEventListener('input', (e) => {
            renderTasks(e.target.value);
        });

        renderTasks();
    </script>
</body>

</html>
