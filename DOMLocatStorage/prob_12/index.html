<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Selector</title>
    <style>
        /* Default light theme styles */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            transition: background-color 0.3s, color 0.3s;
        }

        .theme-light {
            background-color: #ffffff;
            color: #000000;
        }

        .theme-dark {
            background-color: #000000;
            color: #ffffff;
        }

        .theme-blue {
            background-color: #003366;
            color: #ffffff;
        }

        .container {
            padding: 20px;
            text-align: center;
        }

        select {
            padding: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Theme Selector</h1>
        <label for="themeSelector">Select a theme:</label>
        <select id="themeSelector">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="blue">Blue</option>
        </select>
    </div>

    <script>
        
        function applyTheme(theme) {

            document.body.classList.remove('theme-light', 'theme-dark', 'theme-blue');
            
            document.body.classList.add(`theme-${theme}`);
        }

    
        function handleThemeChange(event) {
            const selectedTheme = event.target.value;

            applyTheme(selectedTheme);
    
            sessionStorage.setItem('selectedTheme', selectedTheme);
        }

        // On page load, check sessionStorage for a saved theme
        window.onload = function() {
            const savedTheme = sessionStorage.getItem('selectedTheme') || 'light';
            // Apply the saved theme
            applyTheme(savedTheme);
        
            document.getElementById('themeSelector').value = savedTheme;
        };

        document.getElementById('themeSelector').addEventListener('change', handleThemeChange);
    </script>
</body>
</html>
