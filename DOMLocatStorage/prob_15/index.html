<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-User Shopping Cart</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    table, th, td {
      border: 1px solid #ddd;
    }
    th, td {
      padding: 10px;
      text-align: left;
    }
    .cart-container {
      margin-top: 20px;
    }
    .total-cost {
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Multi-User Shopping Cart</h1>

  <form id="loginForm">
    <label for="username">Enter Username:</label>
    <input type="text" id="username" required>
    <button type="submit">Login</button>
  </form>

  <div class="cart-container" style="display: none;">
    <h2>Shopping Cart</h2>
    <form id="addItemForm">
      <label for="itemName">Item Name:</label>
      <input type="text" id="itemName" required>
      <label for="price">Price:</label>
      <input type="number" id="price" min="0" required>
      <label for="quantity">Quantity:</label>
      <input type="number" id="quantity" min="1" required>
      <button type="submit">Add Item</button>
    </form>

    <table id="cartTable">
      <thead>
        <tr>
          <th>Item Name</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Total Cost</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <p class="total-cost">Total: $<span id="totalCost">0</span></p>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const addItemForm = document.getElementById('addItemForm');
    const usernameInput = document.getElementById('username');
    const cartContainer = document.querySelector('.cart-container');
    const cartTable = document.getElementById('cartTable').querySelector('tbody');
    const totalCostElement = document.getElementById('totalCost');

    let currentUser = null;

    // Retrieve cart for the current user
    const getCart = (username) => {
      const allCarts = JSON.parse(localStorage.getItem('shoppingCarts') || '{}');
      return allCarts[username] || [];
    };

    // Save cart for the current user
    const saveCart = (username, cart) => {
      const allCarts = JSON.parse(localStorage.getItem('shoppingCarts') || '{}');
      allCarts[username] = cart;
      localStorage.setItem('shoppingCarts', JSON.stringify(allCarts));
    };

    // Render the cart table
    const renderCart = () => {
      const cart = getCart(currentUser);
      cartTable.innerHTML = '';
      let totalCost = 0;

      cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        totalCost += itemTotal;

        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${item.itemName}</td>
          <td>$${item.price.toFixed(2)}</td>
          <td>
            <input type="number" value="${item.quantity}" min="1" data-index="${index}" class="quantity-input">
          </td>
          <td>$${itemTotal.toFixed(2)}</td>
          <td>
            <button data-index="${index}" class="remove-btn">Remove</button>
          </td>
        `;
        cartTable.appendChild(row);
      });

      totalCostElement.textContent = totalCost.toFixed(2);
    };

    // Handle login
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      currentUser = usernameInput.value.trim();
      if (!currentUser) {
        alert('Please enter a valid username.');
        return;
      }

      cartContainer.style.display = 'block';
      renderCart();
    });

    // Handle adding items
    addItemForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const itemName = document.getElementById('itemName').value.trim();
      const price = parseFloat(document.getElementById('price').value);
      const quantity = parseInt(document.getElementById('quantity').value, 10);

      if (!itemName || price <= 0 || quantity <= 0) {
        alert('Please enter valid item details.');
        return;
      }

      const cart = getCart(currentUser);
      cart.push({ itemName, price, quantity });
      saveCart(currentUser, cart);
      renderCart();

      addItemForm.reset();
    });

    // Handle updating quantities and removing items
    cartTable.addEventListener('click', (e) => {
      const cart = getCart(currentUser);

      if (e.target.classList.contains('remove-btn')) {
        const index = e.target.dataset.index;
        cart.splice(index, 1);
        saveCart(currentUser, cart);
        renderCart();
      }

      if (e.target.classList.contains('quantity-input')) {
        const index = e.target.dataset.index;
        const newQuantity = parseInt(e.target.value, 10);
        if (newQuantity > 0) {
          cart[index].quantity = newQuantity;
          saveCart(currentUser, cart);
          renderCart();
        }
      }
    });
  </script>
</body>
</html>
